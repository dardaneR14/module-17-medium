
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Ordered List</title>



    <style>
        /* CSS variable */
        :root {
            --list-bg: #d8c4f1;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f0fa;
            padding: 30px;
        }

        h1 {
            color: #68458c;
        }

        /* Ordered list */
        ol {
            list-style: none;
            counter-reset: my-counter;
            padding: 0;
        }

        /* List items */
        li {
            counter-increment: my-counter;
            background-color: var(--list-bg);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        /* Automatic numbering */
        li::before {
            content: counter(my-counter) ". ";
            font-weight: bold;
        }

        button {
            padding: 10px 15px;
            background-color: #68458c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>My Ordered List</h1>

    <ol>
        <li>Learn HTML</li>
        <li>Learn CSS</li>
        <li>Learn JavaScript</li>
        <li>Create a website</li>
    </ol>

    <button onclick="changeColor()">
        Change Background Color
    </button>

    <script>
        function changeColor() {
            const colors = [
                "#d8c4f1",
                "#ffc9d9",
                "#c5e8d5",
                "#ffe5a3",
                "#b9d9f5"
            ];

            const randomColor =
                colors[Math.floor(Math.random() * colors.length)];

            document.documentElement.style.setProperty(
                "--list-bg",
                randomColor
            );
        }
    </script>


<!--This was confousing due to the fact we havnt learend javasccript yet :/ -->


</body>
</html>
